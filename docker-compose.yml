services:
  web:
    image: ghcr.io/ascrepo/ascrepo:latest
    container_name: pale_array_web
    ports:
      - "8080:8080"     # host:container – adjust to the image’s exposed port
    volumes:
      - ./pale_array_site:/usr/share/nginx/html:ro  # drop this if the image already contains the site
    restart: unless-stopped
    environment:
      - PORT=8080       # only keep keys the ASC image actually understands

